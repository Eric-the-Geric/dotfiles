; Wallpaper colors are generated by colourme. Keep these markers and names.
;>>>>>colours>>>>>
[colors]
background = #081c30
background-alt = #283847
disabled = #5e686f
primary = #8f8691
secondary = #c17b88
alert = #f5ceb6
foreground = #fbf2e1
;<<<<<colours<<<<<

; Main bar on the primary display.
[bar/time_s1]
monitor = ${env:POLYBAR_MONITOR}
width = 100%
height = 34pt
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 3px
border-color = ${env:POLYBAR_I3_BORDER}
border-left-size = 35px
border-right-size = 35px
border-left-color = #00000000
border-right-color = #00000000
line-size = 2pt
padding-left = 0
padding-right = 0
module-margin = 0
font-0 = HackNerdFont:size=10;3
modules-left = edge-left launcher spotify focus-timer
modules-center = date
modules-right = bluetooth windowmenu calculator systray edge-right
cursor-click = pointer
enable-ipc = true

; Window title and system health on the primary display.
[bar/mybar]
monitor = ${env:POLYBAR_MONITOR}
bottom = true
width = 100%
height = 29pt
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 3px
border-color = ${env:POLYBAR_I3_BORDER}
border-left-size = 35px
border-right-size = 35px
border-left-color = #00000000
border-right-color = #00000000
line-size = 2pt
padding-left = 0
padding-right = 0
module-margin = 0
font-0 = HackNerdFont:size=10;3
modules-left = edge-left xworkspaces
modules-center = xwindow
modules-right = wlan eth filesystem memory cpu pulseaudio edge-right
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/edge-left]
type = custom/text
format = "%{O3px}"
format-background = ${env:POLYBAR_I3_BORDER}

[module/edge-right]
type = custom/text
format = "%{O3px}"
format-background = ${env:POLYBAR_I3_BORDER}

[module/launcher]
type = custom/text
format = "󰣇  APPS"
format-foreground = ${colors.primary}
format-padding = 1
click-left = rofi -show drun

[module/spotify]
type = custom/script
exec = ~/.config/polybar/spotify
interval = 2
format = <label>
format-foreground = ${colors.primary}
format-padding = 1
label = %output%

[module/focus-timer]
; Left click pauses/resumes, middle click switches focus/break, right click resets.
type = custom/script
exec = ~/.config/polybar/focus-timer status
interval = 1
format = <label>
format-foreground = ${colors.secondary}
format-padding = 1
label = %output%
click-left = ~/.config/polybar/focus-timer toggle
click-middle = ~/.config/polybar/focus-timer mode
click-right = ~/.config/polybar/focus-timer reset

[module/bluetooth]
; Left click opens Blueman, right click toggles Bluetooth power.
type = custom/script
exec = ~/.config/polybar/bluetooth status
interval = 10
format = <label>
format-foreground = ${colors.secondary}
format-padding = 1
label = %output%
click-left = blueman-manager
click-right = ~/.config/polybar/bluetooth toggle

[module/calculator]
type = custom/text
format = "󰃬  CALC"
format-foreground = ${colors.secondary}
format-padding = 1
click-left = ~/.config/polybar/calculator

[module/windowmenu]
type = custom/text
format = "󰕰  WINDOWS"
format-foreground = ${colors.secondary}
format-padding = 1
click-left = rofi -show window

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = true
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 2
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
format-prefix = "󱂬  "
format-prefix-foreground = ${colors.secondary}
label = %title:0:42:...%
label-empty = Desktop
label-empty-foreground = ${colors.disabled}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-margin = 1
format-mounted-prefix = "󰋊  "
format-mounted-prefix-foreground = ${colors.secondary}
label-mounted = %percentage_used%%
label-unmounted = disk unavailable
label-unmounted-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 3
format-margin = 1
format-prefix = "󰍛  "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 3
format-margin = 1
format-prefix = "󰻠  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-margin = 1
format-volume-prefix = "󰕾  "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
format-muted-margin = 1
format-muted-prefix = "󰖁  "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = muted
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-connected-margin = 1
format-disconnected = <label-disconnected>
label-disconnected =

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected-prefix = "󰖩  "
format-connected-prefix-foreground = ${colors.secondary}
label-connected = %essid%

[module/eth]
inherit = network-base
interface-type = wired
format-connected-prefix = "󰈀  "
format-connected-prefix-foreground = ${colors.secondary}
label-connected = LAN

[module/systray]
type = internal/tray
format-margin = 6pt
tray-spacing = 8pt

[module/date]
type = custom/script
exec = date '+%a %d %b  ·  %H:%M'
interval = 1
format-prefix = "󰥔  "
format-prefix-foreground = ${colors.primary}
format-underline = ${colors.primary}
label = %output%
click-left = firefox --new-window https://calendar.google.com/

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
